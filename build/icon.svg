<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="0.55" stop-color="#1877F2"/>
      <stop offset="1" stop-color="#0A5BD3"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="356" y1="350" x2="686" y2="606">
      <stop offset="0" stop-color="#3D92FB"/>
      <stop offset="1" stop-color="#0E63DD"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06264f" flood-opacity="0.35"/>
    </filter>
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06306b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px rounded square inside a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- chat bubble with a tail at the bottom left -->
  <g filter="url(#bubbleShadow)">
    <path fill="#fff" d="
      M 330 262
      H 694
      A 118 118 0 0 1 812 380
      V 574
      A 118 118 0 0 1 694 692
      H 418
      L 296 790
      C 288 796 278 790 280 780
      L 300 684
      A 118 118 0 0 1 212 574
      V 380
      A 118 118 0 0 1 330 262
      Z"/>
  </g>

  <!-- "E" whose arms read as lines of message text -->
  <g fill="url(#ink)">
    <rect x="356" y="350" width="62" height="256" rx="31"/>
    <rect x="356" y="350" width="330" height="62" rx="31"/>
    <rect x="356" y="447" width="250" height="62" rx="31"/>
    <rect x="356" y="544" width="300" height="62" rx="31"/>
  </g>
</svg>
